<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>EnderRead — Novel Reader</title>
  <meta name="description" content="A cozy web-based novel reader for .txt, .epub and .pdf files with themes, fonts and reading tools." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=Inter:wght@400;500;600;700;800&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet" />

  <!-- PDF.js (renders .pdf pages). Falls back gracefully if offline. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous"></script>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b45309'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='18' font-weight='bold' text-anchor='middle' fill='%23fff'%3E%E2%9C%96%3C/text%3E%3C/svg%3E" />

  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="light">

  <!-- ================= LIBRARY ================= -->
  <div id="library-view" class="view">
    <header class="lib-header">
      <div class="lib-header-inner">
        <a href="#" class="brand" onclick="return false">
          <span class="brand-mark">✒</span>
          <span class="brand-text">EnderRead</span>
        </a>
        <div class="lib-actions">
          <a href="books.html" class="icon-btn" title="Books page" aria-label="Books page">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          </a>
          <button class="icon-btn" id="btn-refresh" title="Reload the book list from books.json" aria-label="Reload book list">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          </button>
          <button class="btn-primary" id="btn-add" title="Send your book to this Discord account and it'll be added here">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            <span>@EnderChicken</span>
          </button>
        </div>
      </div>
    </header>

    <main class="lib-main">
      <div class="lib-stats">
        <div class="stat-card"><p class="stat-num" id="stat-books">0</p><p class="stat-lbl">Books</p></div>
        <div class="stat-card"><p class="stat-num" id="stat-time">0m</p><p class="stat-lbl">Time read</p></div>
        <div class="stat-card"><p class="stat-num" id="stat-pages">0</p><p class="stat-lbl">Pages</p></div>
      </div>

      <section class="lib-grid" id="lib-grid"></section>
    </main>
  </div>

  <!-- ================= READER ================= -->
  <div id="reader-view" class="view" hidden>
    <header class="rdr-header">
      <button class="icon-btn" id="btn-back" aria-label="Back to library">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <div class="rdr-title-wrap">
        <span class="rdr-book" id="rdr-book">—</span>
        <span class="rdr-chapter" id="rdr-chapter">—</span>
      </div>
      <select class="chapter-select" id="chapter-select" aria-label="Jump to chapter" title="Jump to chapter"></select>
      <div class="rdr-tools">
        <button class="icon-btn" id="btn-toc" aria-label="Contents">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        </button>
        <button class="icon-btn" id="btn-search" aria-label="Search in book">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
        </button>
        <button class="icon-btn" id="btn-tts" aria-label="Read aloud">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/></svg>
        </button>
        <button class="icon-btn" id="btn-settings" aria-label="Reading settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
        </button>
      </div>
    </header>

    <div class="rdr-progress"><div class="rdr-progress-fill" id="rdr-progress-fill"></div></div>

    <div class="rdr-body">
      <div class="reader-content" id="reader-content"></div>
    </div>

    <div class="tts-bar" id="tts-bar" hidden>
      <button class="icon-btn" id="tts-play" aria-label="Play / pause">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" id="tts-play-icon"><path d="M8 5v14l11-7Z"/></svg>
      </button>
      <button class="icon-btn" id="tts-stop" aria-label="Stop">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
      </button>
      <div class="tts-status" id="tts-status">Read aloud</div>
      <div class="tts-meta" id="tts-meta"></div>
      <button class="icon-btn" id="tts-close" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <footer class="rdr-nav">
      <button class="nav-btn" id="btn-prev" aria-label="Previous chapter">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        <span>Prev</span>
      </button>
      <span class="rdr-progress-text" id="rdr-progress-text">—</span>
      <button class="nav-btn" id="btn-next" aria-label="Next chapter">
        <span>Next</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </footer>
  </div>

  <!-- ================= PANELS ================= -->
  <div class="backdrop" id="backdrop" hidden></div>

  <aside class="panel" id="panel-toc" hidden>
    <div class="panel-head">
      <h3>Contents</h3>
      <button class="icon-btn" data-close="panel-toc" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <ul class="toc-list" id="toc-list"></ul>
  </aside>

  <aside class="panel" id="panel-search" hidden>
    <div class="panel-head">
      <h3>Search</h3>
      <button class="icon-btn" data-close="panel-search" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="search-box">
      <input type="search" id="search-input" placeholder="Search in book…" autocomplete="off" />
    </div>
    <div class="search-results" id="search-results"></div>
  </aside>

  <aside class="panel" id="panel-settings" hidden>
    <div class="panel-head">
      <h3>Reading settings</h3>
      <button class="icon-btn" data-close="panel-settings" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="settings-body">
      <div class="setting-group">
        <p class="setting-label">Theme</p>
        <div class="theme-row" id="theme-row">
          <button class="theme-swatch" data-theme="light" title="Light"><span class="sw s-light"></span><span class="sw-name">Light</span></button>
          <button class="theme-swatch" data-theme="sepia" title="Sepia"><span class="sw s-sepia"></span><span class="sw-name">Sepia</span></button>
          <button class="theme-swatch" data-theme="dark" title="Dark"><span class="sw s-dark"></span><span class="sw-name">Dark</span></button>
          <button class="theme-swatch" data-theme="night" title="Night"><span class="sw s-night"></span><span class="sw-name">Night</span></button>
        </div>
      </div>

      <div class="setting-group">
        <p class="setting-label">Font</p>
        <div class="font-row" id="font-row">
          <button class="font-opt" data-font="Literata">Literata</button>
          <button class="font-opt" data-font="Lora">Lora</button>
          <button class="font-opt" data-font="EBGaramond">EB Garamond</button>
          <button class="font-opt" data-font="Georgia">Georgia</button>
          <button class="font-opt" data-font="Inter">Inter</button>
        </div>
      </div>

      <div class="setting-group">
        <div class="range-row">
          <p class="setting-label">Font size</p>
          <span class="range-val" id="size-val">18</span>
        </div>
        <input type="range" id="size-range" min="13" max="30" step="1" />
      </div>

      <div class="setting-group">
        <div class="range-row">
          <p class="setting-label">Line height</p>
          <span class="range-val" id="lh-val">1.8</span>
        </div>
        <input type="range" id="lh-range" min="1.3" max="2.4" step="0.1" />
      </div>

      <div class="setting-group">
        <div class="range-row">
          <p class="setting-label">Text width</p>
          <span class="range-val" id="width-val">700</span>
        </div>
        <input type="range" id="width-range" min="520" max="900" step="20" />
      </div>

      <div class="setting-group setting-row">
        <div>
          <p class="setting-label">Justify text</p>
          <p class="setting-sub">Stretch lines to fill the width</p>
        </div>
        <button class="toggle" id="justify-toggle" role="switch" aria-checked="true"></button>
      </div>

      <div class="setting-group">
        <div class="range-row">
          <p class="setting-label">Reading speed</p>
          <span class="range-val" id="rate-val">1.0×</span>
        </div>
        <input type="range" id="rate-range" min="0.5" max="2" step="0.1" />
      </div>

      <div class="setting-group">
        <p class="setting-label">Voice</p>
        <select id="voice-select" class="voice-select"></select>
      </div>
    </div>
  </aside>

  <div class="toasts" id="toasts"></div>

  <script src="script.js"></script>
</body>
</html>
